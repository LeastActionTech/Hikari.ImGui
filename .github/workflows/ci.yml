name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Test & Pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore Hikari.ImGui.sln

    - name: Build Solution
      run: dotnet build Hikari.ImGui.sln -c Release --no-restore

    - name: Run Test Suite
      run: dotnet test Hikari.ImGui.Test/Hikari.ImGui.Test.csproj -c Release --no-build --verbosity normal

    - name: Pack NuGet Package
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack Hikari.ImGui/Hikari.ImGui.csproj -c Release --no-build -o ./artifacts/packages

    - name: Upload NuGet Package Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/packages/*.nupkg
